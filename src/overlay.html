<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellness Break</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --accent-soft: #e2e8f0;
      --accent-muted: #94a3b8;
      --accent-warm: #fef3e2;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --glow: rgba(226, 232, 240, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      overflow: hidden;
      background: var(--bg-primary);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(160deg,
        var(--bg-primary) 0%,
        var(--bg-secondary) 50%,
        #1a1a2e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 2.5s ease-in-out;
    }

    .overlay.visible {
      opacity: 1;
    }

    /* Gentle ambient glow */
    .ambient-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(148, 163, 184, 0.08) 0%, transparent 70%);
      pointer-events: none;
      animation: drift 20s ease-in-out infinite;
    }

    .ambient-glow:nth-child(1) {
      top: -200px;
      left: -100px;
    }

    .ambient-glow:nth-child(2) {
      bottom: -200px;
      right: -100px;
      animation-delay: -10s;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 20px) scale(1.05); }
    }

    .content {
      text-align: center;
      color: var(--text-primary);
      max-width: 700px;
      padding: 40px;
      position: relative;
      z-index: 10;
    }

    /* Activity queue - minimal dots */
    .activity-queue {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 50px;
    }

    .queue-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-muted);
      opacity: 0.3;
      transition: all 0.5s ease;
    }

    .queue-dot.active {
      opacity: 1;
      background: var(--accent-soft);
      transform: scale(1.5);
    }

    .queue-dot.completed {
      opacity: 0.6;
      background: var(--accent-soft);
    }

    /* Activity type label */
    .activity-type {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--accent-muted);
      margin-bottom: 16px;
      font-weight: 500;
    }

    .activity-name {
      font-size: 38px;
      font-weight: 300;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .activity-instructions {
      font-size: 18px;
      font-weight: 300;
      line-height: 1.7;
      margin-bottom: 50px;
      color: var(--text-secondary);
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Visual area for stretches */
    .visual-container {
      width: 160px;
      height: 160px;
      margin: 0 auto 40px;
      position: relative;
      display: none;
    }

    .visual-container.visible {
      display: block;
    }

    .stretch-figure {
      width: 100%;
      height: 100%;
    }

    .stretch-figure line,
    .stretch-figure path {
      stroke: var(--accent-muted);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }

    .stretch-figure circle {
      fill: var(--accent-muted);
    }

    /* Breathing circle */
    .breathing-circle {
      width: 160px;
      height: 160px;
      margin: 0 auto 40px;
      border-radius: 50%;
      border: 1px solid var(--accent-muted);
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
    }

    .breathing-circle.visible {
      display: flex;
    }

    .breathing-circle.breathing-in {
      animation: breatheIn 4s ease-in-out forwards;
    }

    .breathing-circle.breathing-out {
      animation: breatheOut 4s ease-in-out forwards;
    }

    .breathing-circle.breathing-hold {
      transform: scale(1.3);
      opacity: 0.8;
    }

    @keyframes breatheIn {
      from { transform: scale(1); opacity: 0.4; }
      to { transform: scale(1.3); opacity: 0.8; }
    }

    @keyframes breatheOut {
      from { transform: scale(1.3); opacity: 0.8; }
      to { transform: scale(1); opacity: 0.4; }
    }

    .breathing-text {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-muted);
    }

    /* Posture indicator */
    .posture-visual {
      width: 120px;
      height: 120px;
      margin: 0 auto 40px;
      display: none;
    }

    .posture-visual.visible {
      display: block;
    }

    /* Timer */
    .timer-container {
      margin-bottom: 50px;
      display: none;
    }

    .timer-container.visible {
      display: block;
    }

    .timer-ring {
      width: 140px;
      height: 140px;
      margin: 0 auto;
      position: relative;
    }

    .timer-ring svg {
      transform: rotate(-90deg);
    }

    .timer-ring circle {
      fill: none;
      stroke-width: 2;
    }

    .timer-ring .bg {
      stroke: rgba(148, 163, 184, 0.15);
    }

    .timer-ring .progress {
      stroke: var(--accent-soft);
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
      opacity: 0.8;
    }

    .timer-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      font-weight: 200;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    /* Buttons */
    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .btn {
      padding: 14px 36px;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 400;
      letter-spacing: 0.5px;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent-soft);
      color: var(--bg-primary);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(226, 232, 240, 0.15);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .btn-secondary:hover {
      border-color: rgba(148, 163, 184, 0.5);
      color: var(--text-primary);
    }

    .btn-text {
      background: transparent;
      color: var(--accent-muted);
      border: none;
      font-size: 13px;
      padding: 10px 20px;
    }

    .btn-text:hover {
      color: var(--text-secondary);
    }

    .snooze-info {
      margin-top: 12px;
      font-size: 12px;
      color: var(--accent-muted);
    }

    /* Start screen (before timer begins) */
    .start-prompt {
      display: none;
    }

    .start-prompt.visible {
      display: block;
    }

    .timer-container.waiting {
      opacity: 0.3;
    }

    /* Keyboard hint */
    .keyboard-hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--accent-muted);
      opacity: 0.5;
    }

    kbd {
      background: rgba(148, 163, 184, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
    }

    /* Animations for figures */
    .figure-animated {
      animation: gentleBob 3s ease-in-out infinite;
    }

    @keyframes gentleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* Neck roll specific */
    .neck-roll-anim .head {
      animation: neckRollMotion 4s ease-in-out infinite;
      transform-origin: center bottom;
    }

    @keyframes neckRollMotion {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(15deg); }
      50% { transform: rotate(0deg); }
      75% { transform: rotate(-15deg); }
    }

    /* Shoulder shrug */
    .shoulder-shrug-anim .shoulders {
      animation: shrugMotion 2s ease-in-out infinite;
    }

    @keyframes shrugMotion {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Wrist circle */
    .wrist-circle-anim .hand {
      animation: wristMotion 2s linear infinite;
      transform-origin: center;
    }

    @keyframes wristMotion {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Breathing pulse for mindfulness text */
    .breath-instruction {
      font-size: 20px;
      color: var(--text-secondary);
      margin-bottom: 30px;
      opacity: 0.8;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <!-- Ambient background elements -->
    <div class="ambient-glow"></div>
    <div class="ambient-glow"></div>

    <div class="content">
      <div class="activity-queue" id="activityQueue"></div>

      <div class="activity-type" id="activityType">Eye Break</div>
      <h1 class="activity-name" id="activityName">Look Away</h1>
      <p class="activity-instructions" id="activityInstructions">
        Look at something 20 feet away for 20 seconds.
      </p>

      <!-- Breathing instruction (for mindfulness) -->
      <p class="breath-instruction" id="breathInstruction" style="display: none;"></p>

      <!-- Visual containers -->
      <div class="visual-container" id="stretchVisual">
        <svg class="stretch-figure" viewBox="0 0 100 100" id="stretchSvg"></svg>
      </div>

      <div class="breathing-circle" id="breathingCircle">
        <span class="breathing-text" id="breathingText">breathe</span>
      </div>

      <svg class="posture-visual" id="postureVisual" viewBox="0 0 100 120">
        <!-- Sitting figure -->
        <g id="sitFigure" style="display: none;">
          <circle cx="50" cy="25" r="10" fill="#94a3b8"/>
          <path d="M50 35 L50 60" stroke="#94a3b8" stroke-width="2"/>
          <path d="M50 60 L35 75 L35 95" stroke="#94a3b8" stroke-width="2"/>
          <path d="M50 60 L65 75 L65 95" stroke="#94a3b8" stroke-width="2"/>
          <path d="M50 45 L30 55" stroke="#94a3b8" stroke-width="2"/>
          <path d="M50 45 L70 55" stroke="#94a3b8" stroke-width="2"/>
          <rect x="25" y="70" width="50" height="5" rx="2" fill="#64748b" opacity="0.5"/>
        </g>
        <!-- Standing figure -->
        <g id="standFigure" style="display: none;">
          <circle cx="50" cy="20" r="10" fill="#94a3b8"/>
          <path d="M50 30 L50 65" stroke="#94a3b8" stroke-width="2"/>
          <path d="M50 65 L40 100" stroke="#94a3b8" stroke-width="2"/>
          <path d="M50 65 L60 100" stroke="#94a3b8" stroke-width="2"/>
          <path d="M50 40 L30 55" stroke="#94a3b8" stroke-width="2"/>
          <path d="M50 40 L70 55" stroke="#94a3b8" stroke-width="2"/>
        </g>
      </svg>

      <!-- Timer -->
      <div class="timer-container" id="timerContainer">
        <div class="timer-ring">
          <svg width="140" height="140" viewBox="0 0 140 140">
            <circle class="bg" cx="70" cy="70" r="64"/>
            <circle class="progress" id="timerProgress" cx="70" cy="70" r="64"
                    stroke-dasharray="402.12" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-text" id="timerText">20</div>
        </div>
      </div>

      <!-- Start prompt (shown before timer) -->
      <div class="start-prompt" id="startPrompt">
        <button class="btn btn-primary" id="btnStart" autofocus>Begin</button>
      </div>

      <!-- Action buttons (shown during/after timer) -->
      <div class="buttons" id="actionButtons" style="display: none;">
        <button class="btn btn-primary" id="btnDone">Done</button>
        <button class="btn btn-secondary" id="btnSnooze">Snooze</button>
      </div>
      <button class="btn btn-text" id="btnSkip">Skip this break</button>
      <div class="snooze-info" id="snoozeInfo"></div>
    </div>

    <div class="keyboard-hint">
      <kbd>Enter</kbd> or <kbd>Space</kbd> to begin/advance · <kbd>Esc</kbd> skip
    </div>
  </div>

  <audio id="chimeSound" preload="auto">
    <source src="../sounds/chime.wav" type="audio/wav">
  </audio>

  <script>
    const { ipcRenderer } = require('electron');

    let currentBreakData = null;
    let currentActivityIndex = 0;
    let timerInterval = null;
    let breathingInterval = null;
    let remainingTime = 0;
    let snoozesRemaining = 3;
    let timerStarted = false;

    const overlay = document.getElementById('overlay');
    const activityType = document.getElementById('activityType');
    const activityName = document.getElementById('activityName');
    const activityInstructions = document.getElementById('activityInstructions');
    const timerProgress = document.getElementById('timerProgress');
    const timerText = document.getElementById('timerText');
    const timerContainer = document.getElementById('timerContainer');
    const activityQueue = document.getElementById('activityQueue');
    const stretchVisual = document.getElementById('stretchVisual');
    const stretchSvg = document.getElementById('stretchSvg');
    const breathingCircle = document.getElementById('breathingCircle');
    const breathingText = document.getElementById('breathingText');
    const breathInstruction = document.getElementById('breathInstruction');
    const postureVisual = document.getElementById('postureVisual');
    const startPrompt = document.getElementById('startPrompt');
    const actionButtons = document.getElementById('actionButtons');
    const btnStart = document.getElementById('btnStart');
    const btnDone = document.getElementById('btnDone');
    const btnSnooze = document.getElementById('btnSnooze');
    const btnSkip = document.getElementById('btnSkip');
    const snoozeInfo = document.getElementById('snoozeInfo');
    const chimeSound = document.getElementById('chimeSound');

    // Activity type labels (no emojis)
    const typeLabels = {
      'eye': 'Eye Break',
      'micro-stretch': 'Quick Stretch',
      'full-stretch': 'Full Stretch',
      'posture': 'Posture',
      'walk': 'Movement',
      'breathing': 'Mindfulness'
    };

    // Stretch SVG figures
    const stretchFigures = {
      'neck-roll': `
        <g class="neck-roll-anim figure-animated">
          <circle class="head" cx="50" cy="25" r="10"/>
          <line x1="50" y1="35" x2="50" y2="65"/>
          <line x1="35" y1="50" x2="65" y2="50"/>
          <line x1="50" y1="65" x2="38" y2="90"/>
          <line x1="50" y1="65" x2="62" y2="90"/>
        </g>
      `,
      'shoulder-shrug': `
        <g class="shoulder-shrug-anim">
          <circle cx="50" cy="22" r="9"/>
          <line x1="50" y1="31" x2="50" y2="60"/>
          <g class="shoulders">
            <line x1="35" y1="42" x2="65" y2="42"/>
            <line x1="35" y1="42" x2="28" y2="58"/>
            <line x1="65" y1="42" x2="72" y2="58"/>
          </g>
          <line x1="50" y1="60" x2="38" y2="88"/>
          <line x1="50" y1="60" x2="62" y2="88"/>
        </g>
      `,
      'wrist-circle': `
        <g class="wrist-circle-anim">
          <line x1="20" y1="50" x2="50" y2="50"/>
          <g class="hand">
            <circle cx="65" cy="50" r="12" stroke-width="2" fill="none" stroke="#94a3b8"/>
          </g>
        </g>
      `,
      'ankle-circle': `
        <g class="figure-animated">
          <line x1="50" y1="20" x2="50" y2="55"/>
          <ellipse cx="50" cy="72" rx="12" ry="6" stroke="#94a3b8" stroke-width="2" fill="none" style="animation: wristMotion 2s linear infinite; transform-origin: 50px 55px;"/>
        </g>
      `,
      'ankle-stretch': `
        <g class="figure-animated">
          <line x1="50" y1="15" x2="50" y2="50"/>
          <line x1="50" y1="50" x2="50" y2="70"/>
          <path d="M50 70 L42 85 L58 85 Z"/>
        </g>
      `,
      'spinal-twist': `
        <g class="figure-animated">
          <circle cx="50" cy="22" r="9"/>
          <path d="M50 31 Q58 45 50 60"/>
          <line x1="38" y1="42" x2="62" y2="48"/>
          <line x1="50" y1="60" x2="40" y2="85"/>
          <line x1="50" y1="60" x2="60" y2="85"/>
        </g>
      `,
      'back-extension': `
        <g class="figure-animated">
          <circle cx="50" cy="28" r="9"/>
          <path d="M50 37 Q42 52 50 68"/>
          <line x1="50" y1="45" x2="32" y2="38"/>
          <line x1="50" y1="45" x2="68" y2="38"/>
          <line x1="50" y1="68" x2="40" y2="92"/>
          <line x1="50" y1="68" x2="60" y2="92"/>
        </g>
      `,
      'hamstring': `
        <g class="figure-animated">
          <circle cx="35" cy="38" r="8"/>
          <line x1="35" y1="46" x2="48" y2="65"/>
          <line x1="48" y1="65" x2="78" y2="65"/>
          <line x1="35" y1="50" x2="22" y2="62"/>
        </g>
      `,
      'hip-flexor': `
        <g class="figure-animated">
          <circle cx="50" cy="20" r="8"/>
          <line x1="50" y1="28" x2="50" y2="52"/>
          <line x1="50" y1="52" x2="38" y2="78"/>
          <line x1="50" y1="52" x2="65" y2="88"/>
          <line x1="50" y1="38" x2="35" y2="48"/>
          <line x1="50" y1="38" x2="65" y2="48"/>
        </g>
      `,
      'chest-stretch': `
        <g class="figure-animated">
          <circle cx="50" cy="22" r="8"/>
          <line x1="50" y1="30" x2="50" y2="58"/>
          <line x1="50" y1="40" x2="28" y2="30"/>
          <line x1="50" y1="40" x2="72" y2="30"/>
          <line x1="50" y1="58" x2="40" y2="85"/>
          <line x1="50" y1="58" x2="60" y2="85"/>
        </g>
      `,
      'figure-4': `
        <g class="figure-animated">
          <circle cx="50" cy="18" r="8"/>
          <line x1="50" y1="26" x2="50" y2="50"/>
          <line x1="50" y1="50" x2="38" y2="75"/>
          <line x1="50" y1="50" x2="62" y2="62"/>
          <line x1="62" y1="62" x2="45" y2="62"/>
        </g>
      `,
      'calf-stretch': `
        <g class="figure-animated">
          <circle cx="42" cy="28" r="8"/>
          <line x1="42" y1="36" x2="50" y2="55"/>
          <line x1="50" y1="55" x2="38" y2="88"/>
          <line x1="50" y1="55" x2="68" y2="82"/>
          <line x1="42" y1="42" x2="28" y2="48"/>
          <line x1="42" y1="42" x2="56" y2="42"/>
        </g>
      `
    };

    function playChime() {
      try {
        chimeSound.currentTime = 0;
        chimeSound.volume = 0.2;
        chimeSound.play().catch(() => {});
      } catch (e) {}
    }

    function showBreak(breakData) {
      console.log('[Overlay] Received break with activities:', breakData.activities.map(a => a.type));
      currentBreakData = breakData;
      currentActivityIndex = 0;
      snoozesRemaining = 3;
      timerStarted = false;

      playChime();

      // Reset snooze button
      btnSnooze.disabled = false;
      btnSnooze.style.opacity = 1;
      snoozeInfo.textContent = '';

      // Build activity queue dots
      activityQueue.innerHTML = breakData.activities.map((_, i) =>
        `<div class="queue-dot ${i === 0 ? 'active' : ''}"></div>`
      ).join('');

      // Show overlay with fade
      overlay.classList.add('visible');

      showCurrentActivity();
    }

    function showCurrentActivity() {
      // Clear any existing timer first
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      if (breathingInterval) {
        clearInterval(breathingInterval);
        breathingInterval = null;
      }

      const activity = currentBreakData.activities[currentActivityIndex];
      console.log(`[Overlay] Showing activity ${currentActivityIndex + 1}/${currentBreakData.activities.length}: ${activity.type} - ${activity.name}`);
      timerStarted = false;

      // Update queue dots
      document.querySelectorAll('.queue-dot').forEach((dot, i) => {
        dot.classList.remove('active', 'completed');
        if (i < currentActivityIndex) dot.classList.add('completed');
        if (i === currentActivityIndex) dot.classList.add('active');
      });

      // Update text
      activityType.textContent = typeLabels[activity.type] || 'Break';
      activityName.textContent = activity.name;
      activityInstructions.textContent = activity.instructions;

      // Hide all visuals first
      stretchVisual.classList.remove('visible');
      breathingCircle.classList.remove('visible', 'breathing-in', 'breathing-out', 'breathing-hold');
      postureVisual.classList.remove('visible');
      breathInstruction.style.display = 'none';
      document.getElementById('sitFigure').style.display = 'none';
      document.getElementById('standFigure').style.display = 'none';

      // Show appropriate visual
      if (activity.animation && stretchFigures[activity.animation]) {
        stretchVisual.classList.add('visible');
        stretchSvg.innerHTML = stretchFigures[activity.animation];
      } else if (activity.type === 'breathing') {
        breathingCircle.classList.add('visible');
        breathInstruction.style.display = 'block';
      } else if (activity.type === 'posture') {
        postureVisual.classList.add('visible');
        if (activity.newPosture === 'stand') {
          document.getElementById('standFigure').style.display = 'block';
        } else {
          document.getElementById('sitFigure').style.display = 'block';
        }
      }

      // Show timer but in waiting state
      timerContainer.classList.add('visible', 'waiting');
      remainingTime = activity.duration;
      timerText.textContent = remainingTime;
      updateTimerRing(0);

      // Show start button, hide action buttons
      startPrompt.classList.add('visible');
      actionButtons.style.display = 'none';

      // Focus the Begin button so Enter/click works immediately
      setTimeout(() => btnStart.focus(), 50);
    }

    function startTimer() {
      if (timerStarted) return;
      timerStarted = true;

      const activity = currentBreakData.activities[currentActivityIndex];
      const duration = activity.duration;
      remainingTime = duration;

      // Hide start, show actions
      startPrompt.classList.remove('visible');
      actionButtons.style.display = 'flex';
      timerContainer.classList.remove('waiting');

      // Start breathing animation if mindfulness
      if (activity.type === 'breathing') {
        startBreathingCycle();
      }

      const circumference = 2 * Math.PI * 64;
      timerProgress.style.strokeDasharray = circumference;

      if (timerInterval) clearInterval(timerInterval);

      function updateTimer() {
        timerText.textContent = remainingTime;
        const progress = (duration - remainingTime) / duration;
        timerProgress.style.strokeDashoffset = circumference * (1 - progress);

        if (remainingTime <= 0) {
          clearInterval(timerInterval);
          if (breathingInterval) clearInterval(breathingInterval);
          nextActivity();
        } else {
          remainingTime--;
        }
      }

      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimerRing(progress) {
      const circumference = 2 * Math.PI * 64;
      timerProgress.style.strokeDasharray = circumference;
      timerProgress.style.strokeDashoffset = circumference * (1 - progress);
    }

    function startBreathingCycle() {
      // 4-4-4 breathing: 4s in, 4s hold, 4s out
      let phase = 0; // 0=in, 1=hold, 2=out
      const phases = ['in', 'hold', 'out'];
      const instructions = ['Breathe in slowly...', 'Hold...', 'Breathe out slowly...'];

      function nextPhase() {
        breathingCircle.classList.remove('breathing-in', 'breathing-out', 'breathing-hold');

        if (phase === 0) {
          breathingCircle.classList.add('breathing-in');
          breathingText.textContent = 'in';
        } else if (phase === 1) {
          breathingCircle.classList.add('breathing-hold');
          breathingText.textContent = 'hold';
        } else {
          breathingCircle.classList.add('breathing-out');
          breathingText.textContent = 'out';
        }

        breathInstruction.textContent = instructions[phase];
        phase = (phase + 1) % 3;
      }

      nextPhase();
      breathingInterval = setInterval(nextPhase, 4000);
    }

    function nextActivity() {
      if (breathingInterval) {
        clearInterval(breathingInterval);
        breathingInterval = null;
      }

      currentActivityIndex++;
      if (currentActivityIndex >= currentBreakData.activities.length) {
        completeBreak();
      } else {
        showCurrentActivity();
      }
    }

    function completeBreak() {
      if (timerInterval) clearInterval(timerInterval);
      if (breathingInterval) clearInterval(breathingInterval);
      overlay.classList.remove('visible');
      ipcRenderer.send('break-complete');
    }

    function snoozeBreak() {
      ipcRenderer.send('break-snooze');
    }

    function skipBreak() {
      if (timerInterval) clearInterval(timerInterval);
      if (breathingInterval) clearInterval(breathingInterval);
      overlay.classList.remove('visible');
      ipcRenderer.send('break-skip');
    }

    // Event listeners
    btnStart.addEventListener('click', startTimer);
    btnDone.addEventListener('click', nextActivity); // Advance to next activity, not complete entire break
    btnSnooze.addEventListener('click', snoozeBreak);
    btnSkip.addEventListener('click', skipBreak);

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // Escape to skip
      if (e.code === 'Escape') {
        e.preventDefault();
        skipBreak();
        return;
      }
      // Enter or Space to start/advance
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
        e.preventDefault();
        if (!timerStarted) {
          startTimer();
        } else {
          // Move to next activity (not complete entire break)
          nextActivity();
        }
      }
    });

    // Focus the document when it loads to ensure clicks work
    window.addEventListener('focus', () => {
      if (!timerStarted) {
        setTimeout(() => btnStart.focus(), 50);
      }
    });

    // Also capture any click on the overlay to ensure we have focus
    overlay.addEventListener('click', (e) => {
      // If clicking on the overlay background (not a button), focus the start button
      if (e.target === overlay || e.target.classList.contains('content') || e.target.classList.contains('ambient-glow')) {
        if (!timerStarted && startPrompt.classList.contains('visible')) {
          btnStart.focus();
        }
      }
    });

    // IPC listeners
    ipcRenderer.on('show-break', (event, breakData) => {
      showBreak(breakData);
      // Aggressive focus attempts
      const focusTimes = [0, 50, 100, 200, 400];
      focusTimes.forEach(delay => {
        setTimeout(() => {
          window.focus();
          document.body.focus();
          if (!timerStarted && btnStart) {
            btnStart.focus();
          }
        }, delay);
      });
    });

    ipcRenderer.on('snooze-result', (event, result) => {
      if (result.snoozed) {
        if (timerInterval) clearInterval(timerInterval);
        if (breathingInterval) clearInterval(breathingInterval);
        overlay.classList.remove('visible');
        snoozesRemaining = result.remaining;
      } else {
        snoozeInfo.textContent = 'No snoozes remaining';
        btnSnooze.disabled = true;
        btnSnooze.style.opacity = 0.5;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellness Break</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      background: #0a0a0f;
      -webkit-font-smoothing: antialiased;
      cursor: default;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 2s ease;
    }

    .overlay.visible { opacity: 1; }

    /* Living gradient background that slowly breathes */
    .bg-layer {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
    }

    .bg-gradient {
      position: absolute;
      width: 100%; height: 100%;
      background: linear-gradient(170deg, #0a0a12 0%, #0e1018 40%, #0d0f16 100%);
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0;
      transition: opacity 3s ease;
    }

    .overlay.visible .bg-orb { opacity: 1; }

    .bg-orb-1 {
      width: 50vw; height: 50vw;
      top: -10%; left: -10%;
      background: radial-gradient(circle, rgba(90, 80, 140, 0.12), transparent 70%);
      animation: orbDrift1 30s ease-in-out infinite;
    }

    .bg-orb-2 {
      width: 40vw; height: 40vw;
      bottom: -5%; right: -5%;
      background: radial-gradient(circle, rgba(70, 120, 120, 0.08), transparent 70%);
      animation: orbDrift2 25s ease-in-out infinite;
    }

    .bg-orb-3 {
      width: 30vw; height: 30vw;
      top: 40%; left: 50%;
      background: radial-gradient(circle, rgba(100, 90, 130, 0.06), transparent 70%);
      animation: orbDrift3 35s ease-in-out infinite;
    }

    @keyframes orbDrift1 {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(5vw, 3vh); }
      66% { transform: translate(-3vw, 5vh); }
    }

    @keyframes orbDrift2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-4vw, -3vh); }
    }

    @keyframes orbDrift3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(3vw, -2vh) scale(1.1); }
    }

    .content {
      text-align: center;
      position: relative;
      z-index: 10;
      max-width: 520px;
      padding: 40px;
    }

    /* Progress dots - very subtle */
    .activity-queue {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 60px;
      opacity: 0.6;
    }

    .queue-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(180, 175, 200, 0.2);
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .queue-dot.active {
      background: rgba(180, 175, 200, 0.7);
      box-shadow: 0 0 16px rgba(180, 175, 200, 0.3);
      transform: scale(2);
    }

    .queue-dot.completed {
      background: rgba(180, 175, 200, 0.4);
    }

    /* Type label */
    .activity-type {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 5px;
      color: rgba(180, 175, 200, 0.35);
      margin-bottom: 20px;
      font-weight: 500;
    }

    /* Name - large, ethereal */
    .activity-name {
      font-size: 46px;
      font-weight: 200;
      margin-bottom: 24px;
      letter-spacing: -1px;
      color: rgba(230, 225, 240, 0.85);
      line-height: 1.1;
    }

    /* Instructions - gentle guidance */
    .activity-instructions {
      font-size: 16px;
      font-weight: 300;
      line-height: 2;
      margin-bottom: 52px;
      color: rgba(180, 175, 200, 0.5);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    /* === Breathing orb === */
    .breathing-orb-container {
      width: 200px; height: 200px;
      margin: 0 auto 44px;
      display: none;
      position: relative;
    }

    .breathing-orb-container.visible { display: block; }

    .breathing-orb {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 100px; height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%,
        rgba(150, 140, 190, 0.25),
        rgba(100, 90, 150, 0.1) 60%,
        transparent 80%);
      transition: all 4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .breathing-orb.inhale {
      width: 160px; height: 160px;
      background: radial-gradient(circle at 40% 40%,
        rgba(150, 140, 190, 0.35),
        rgba(100, 90, 150, 0.15) 60%,
        transparent 80%);
    }

    .breathing-orb.hold {
      width: 160px; height: 160px;
      background: radial-gradient(circle at 40% 40%,
        rgba(150, 140, 190, 0.35),
        rgba(100, 90, 150, 0.15) 60%,
        transparent 80%);
    }

    .breathing-orb-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 1px solid rgba(150, 140, 190, 0.08);
      transition: all 4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .breathing-orb-ring.inhale,
    .breathing-orb-ring.hold {
      width: 180px; height: 180px;
      border-color: rgba(150, 140, 190, 0.15);
    }

    .breathing-label {
      position: absolute;
      bottom: -8px; left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(180, 175, 200, 0.35);
      font-weight: 300;
      transition: color 1s ease;
    }

    /* Stretch figures */
    .visual-container {
      width: 130px; height: 130px;
      margin: 0 auto 44px;
      display: none;
      opacity: 0.4;
    }

    .visual-container.visible { display: block; }

    .stretch-figure { width: 100%; height: 100%; }
    .stretch-figure line, .stretch-figure path { stroke: rgba(180, 175, 200, 0.6); stroke-width: 1.5; stroke-linecap: round; fill: none; }
    .stretch-figure circle { fill: rgba(180, 175, 200, 0.6); }

    /* Posture */
    .posture-visual {
      width: 100px; height: 100px;
      margin: 0 auto 44px;
      display: none;
      opacity: 0.4;
    }

    .posture-visual.visible { display: block; }

    /* Timer - just a thin arc and number */
    .timer-container {
      margin-bottom: 52px;
      display: none;
    }

    .timer-container.visible { display: block; }

    .timer-ring {
      width: 120px; height: 120px;
      margin: 0 auto;
      position: relative;
    }

    .timer-ring svg { transform: rotate(-90deg); }

    .timer-ring circle { fill: none; }
    .timer-ring .bg { stroke: rgba(180, 175, 200, 0.06); stroke-width: 1; }

    .timer-ring .progress {
      stroke: rgba(180, 175, 200, 0.3);
      stroke-width: 1;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }

    .timer-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 200;
      color: rgba(230, 225, 240, 0.6);
      font-variant-numeric: tabular-nums;
    }

    /* Buttons - nearly invisible until hovered */
    .btn {
      padding: 12px 28px;
      font-size: 12px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.4s ease;
      font-weight: 400;
      letter-spacing: 1px;
      font-family: inherit;
      outline: none;
      text-transform: lowercase;
    }

    .btn:focus-visible { box-shadow: 0 0 0 1px rgba(180, 175, 200, 0.3); }

    .btn-primary {
      background: rgba(180, 175, 200, 0.08);
      color: rgba(230, 225, 240, 0.6);
      border: 1px solid rgba(180, 175, 200, 0.1);
    }

    .btn-primary:hover, .btn-primary:focus {
      background: rgba(180, 175, 200, 0.14);
      color: rgba(230, 225, 240, 0.8);
    }

    .btn-secondary {
      background: transparent;
      color: rgba(180, 175, 200, 0.3);
      border: 1px solid rgba(180, 175, 200, 0.06);
    }

    .btn-secondary:hover {
      color: rgba(180, 175, 200, 0.5);
      border-color: rgba(180, 175, 200, 0.12);
    }

    .btn-skip {
      background: transparent;
      color: rgba(180, 175, 200, 0.15);
      border: none;
      font-size: 11px;
      padding: 8px 16px;
      margin-top: 8px;
    }

    .btn-skip:hover { color: rgba(180, 175, 200, 0.35); }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 8px;
    }

    .snooze-info {
      margin-top: 8px;
      font-size: 10px;
      color: rgba(180, 175, 200, 0.2);
    }

    .start-prompt { display: none; }
    .start-prompt.visible { display: block; }
    .timer-container.waiting { opacity: 0.2; }

    .keyboard-hint {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(180, 175, 200, 0.15);
      letter-spacing: 0.5px;
    }

    kbd {
      padding: 1px 5px;
      font-family: inherit;
      font-size: 9px;
    }

    .breath-instruction {
      font-size: 16px;
      color: rgba(180, 175, 200, 0.4);
      margin-bottom: 28px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    /* Animations */
    .figure-animated { animation: gentleBob 4s ease-in-out infinite; }
    @keyframes gentleBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

    .neck-roll-anim .head { animation: neckRoll 5s ease-in-out infinite; transform-origin: center bottom; }
    @keyframes neckRoll { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(12deg); } 75% { transform: rotate(-12deg); } }

    .shoulder-shrug-anim .shoulders { animation: shrug 2.5s ease-in-out infinite; }
    @keyframes shrug { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    .wrist-circle-anim .hand { animation: wrist 2.5s linear infinite; transform-origin: center; }
    @keyframes wrist { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="bg-layer">
      <div class="bg-gradient"></div>
      <div class="bg-orb bg-orb-1"></div>
      <div class="bg-orb bg-orb-2"></div>
      <div class="bg-orb bg-orb-3"></div>
    </div>

    <div class="content">
      <div class="activity-queue" id="activityQueue"></div>
      <div class="activity-type" id="activityType"></div>
      <h1 class="activity-name" id="activityName"></h1>
      <p class="activity-instructions" id="activityInstructions"></p>

      <p class="breath-instruction" id="breathInstruction" style="display: none;"></p>

      <div class="visual-container" id="stretchVisual">
        <svg class="stretch-figure" viewBox="0 0 100 100" id="stretchSvg"></svg>
      </div>

      <div class="breathing-orb-container" id="breathingOrbContainer">
        <div class="breathing-orb" id="breathingOrb"></div>
        <div class="breathing-orb-ring" id="breathingOrbRing"></div>
        <div class="breathing-label" id="breathingLabel">breathe</div>
      </div>

      <svg class="posture-visual" id="postureVisual" viewBox="0 0 100 120">
        <g id="sitFigure" style="display:none;">
          <circle cx="50" cy="25" r="10" fill="rgba(180,175,200,0.5)"/>
          <path d="M50 35 L50 60" stroke="rgba(180,175,200,0.5)" stroke-width="1.5"/>
          <path d="M50 60 L35 75 L35 95" stroke="rgba(180,175,200,0.5)" stroke-width="1.5"/>
          <path d="M50 60 L65 75 L65 95" stroke="rgba(180,175,200,0.5)" stroke-width="1.5"/>
          <path d="M50 45 L30 55" stroke="rgba(180,175,200,0.5)" stroke-width="1.5"/>
          <path d="M50 45 L70 55" stroke="rgba(180,175,200,0.5)" stroke-width="1.5"/>
          <rect x="25" y="70" width="50" height="3" rx="1.5" fill="rgba(180,175,200,0.2)"/>
        </g>
        <g id="standFigure" style="display:none;">
          <circle cx="50" cy="20" r="10" fill="rgba(180,175,200,0.5)"/>
          <path d="M50 30 L50 65" stroke="rgba(180,175,200,0.5)" stroke-width="1.5"/>
          <path d="M50 65 L40 100" stroke="rgba(180,175,200,0.5)" stroke-width="1.5"/>
          <path d="M50 65 L60 100" stroke="rgba(180,175,200,0.5)" stroke-width="1.5"/>
          <path d="M50 40 L30 55" stroke="rgba(180,175,200,0.5)" stroke-width="1.5"/>
          <path d="M50 40 L70 55" stroke="rgba(180,175,200,0.5)" stroke-width="1.5"/>
        </g>
      </svg>

      <div class="timer-container" id="timerContainer">
        <div class="timer-ring">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle class="bg" cx="60" cy="60" r="56"/>
            <circle class="progress" id="timerProgress" cx="60" cy="60" r="56"
                    stroke-dasharray="351.86" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-text" id="timerText">20</div>
        </div>
      </div>

      <div class="start-prompt" id="startPrompt">
        <button class="btn btn-primary" id="btnStart" autofocus tabindex="0">begin</button>
      </div>

      <div class="buttons" id="actionButtons" style="display: none;">
        <button class="btn btn-primary" id="btnDone" tabindex="0">done</button>
        <button class="btn btn-secondary" id="btnSnooze" tabindex="0">snooze</button>
      </div>
      <button class="btn btn-skip" id="btnSkip" tabindex="0">skip</button>
      <div class="snooze-info" id="snoozeInfo"></div>
    </div>

    <div class="keyboard-hint">
      <kbd>enter</kbd> begin &middot; <kbd>esc</kbd> skip
    </div>
  </div>

  <audio id="chimeSound" preload="auto">
    <source src="../sounds/chime.wav" type="audio/wav">
  </audio>

  <script>
    const { ipcRenderer } = require('electron');

    let currentBreakData = null;
    let currentActivityIndex = 0;
    let timerInterval = null;
    let breathingInterval = null;
    let remainingTime = 0;
    let timerStarted = false;

    const $ = id => document.getElementById(id);
    const overlay = $('overlay');
    const activityType = $('activityType');
    const activityName = $('activityName');
    const activityInstructions = $('activityInstructions');
    const timerProgress = $('timerProgress');
    const timerText = $('timerText');
    const timerContainer = $('timerContainer');
    const activityQueue = $('activityQueue');
    const stretchVisual = $('stretchVisual');
    const stretchSvg = $('stretchSvg');
    const breathingOrbContainer = $('breathingOrbContainer');
    const breathingOrb = $('breathingOrb');
    const breathingOrbRing = $('breathingOrbRing');
    const breathingLabel = $('breathingLabel');
    const breathInstruction = $('breathInstruction');
    const postureVisual = $('postureVisual');
    const startPrompt = $('startPrompt');
    const actionButtons = $('actionButtons');
    const btnStart = $('btnStart');
    const btnDone = $('btnDone');
    const btnSnooze = $('btnSnooze');
    const btnSkip = $('btnSkip');
    const snoozeInfo = $('snoozeInfo');
    const chimeSound = $('chimeSound');

    const typeLabels = {
      'eye': 'Eyes',
      'micro-stretch': 'Stretch',
      'full-stretch': 'Stretch',
      'posture': 'Posture',
      'walk': 'Move',
      'breathing': 'Breathe'
    };

    const stretchFigures = {
      'neck-roll': '<g class="neck-roll-anim figure-animated"><circle class="head" cx="50" cy="25" r="10"/><line x1="50" y1="35" x2="50" y2="65"/><line x1="35" y1="50" x2="65" y2="50"/><line x1="50" y1="65" x2="38" y2="90"/><line x1="50" y1="65" x2="62" y2="90"/></g>',
      'shoulder-shrug': '<g class="shoulder-shrug-anim"><circle cx="50" cy="22" r="9"/><line x1="50" y1="31" x2="50" y2="60"/><g class="shoulders"><line x1="35" y1="42" x2="65" y2="42"/><line x1="35" y1="42" x2="28" y2="58"/><line x1="65" y1="42" x2="72" y2="58"/></g><line x1="50" y1="60" x2="38" y2="88"/><line x1="50" y1="60" x2="62" y2="88"/></g>',
      'wrist-circle': '<g class="wrist-circle-anim"><line x1="20" y1="50" x2="50" y2="50"/><g class="hand"><circle cx="65" cy="50" r="12" stroke-width="1.5" fill="none" stroke="rgba(180,175,200,0.6)"/></g></g>',
      'ankle-circle': '<g class="figure-animated"><line x1="50" y1="20" x2="50" y2="55"/><ellipse cx="50" cy="72" rx="12" ry="6" stroke="rgba(180,175,200,0.6)" stroke-width="1.5" fill="none" style="animation:wrist 2.5s linear infinite;transform-origin:50px 55px;"/></g>',
      'ankle-stretch': '<g class="figure-animated"><line x1="50" y1="15" x2="50" y2="50"/><line x1="50" y1="50" x2="50" y2="70"/><path d="M50 70 L42 85 L58 85 Z"/></g>',
      'spinal-twist': '<g class="figure-animated"><circle cx="50" cy="22" r="9"/><path d="M50 31 Q58 45 50 60"/><line x1="38" y1="42" x2="62" y2="48"/><line x1="50" y1="60" x2="40" y2="85"/><line x1="50" y1="60" x2="60" y2="85"/></g>',
      'back-extension': '<g class="figure-animated"><circle cx="50" cy="28" r="9"/><path d="M50 37 Q42 52 50 68"/><line x1="50" y1="45" x2="32" y2="38"/><line x1="50" y1="45" x2="68" y2="38"/><line x1="50" y1="68" x2="40" y2="92"/><line x1="50" y1="68" x2="60" y2="92"/></g>',
      'hamstring': '<g class="figure-animated"><circle cx="35" cy="38" r="8"/><line x1="35" y1="46" x2="48" y2="65"/><line x1="48" y1="65" x2="78" y2="65"/><line x1="35" y1="50" x2="22" y2="62"/></g>',
      'hip-flexor': '<g class="figure-animated"><circle cx="50" cy="20" r="8"/><line x1="50" y1="28" x2="50" y2="52"/><line x1="50" y1="52" x2="38" y2="78"/><line x1="50" y1="52" x2="65" y2="88"/><line x1="50" y1="38" x2="35" y2="48"/><line x1="50" y1="38" x2="65" y2="48"/></g>',
      'chest-stretch': '<g class="figure-animated"><circle cx="50" cy="22" r="8"/><line x1="50" y1="30" x2="50" y2="58"/><line x1="50" y1="40" x2="28" y2="30"/><line x1="50" y1="40" x2="72" y2="30"/><line x1="50" y1="58" x2="40" y2="85"/><line x1="50" y1="58" x2="60" y2="85"/></g>',
      'figure-4': '<g class="figure-animated"><circle cx="50" cy="18" r="8"/><line x1="50" y1="26" x2="50" y2="50"/><line x1="50" y1="50" x2="38" y2="75"/><line x1="50" y1="50" x2="62" y2="62"/><line x1="62" y1="62" x2="45" y2="62"/></g>',
      'calf-stretch': '<g class="figure-animated"><circle cx="42" cy="28" r="8"/><line x1="42" y1="36" x2="50" y2="55"/><line x1="50" y1="55" x2="38" y2="88"/><line x1="50" y1="55" x2="68" y2="82"/><line x1="42" y1="42" x2="28" y2="48"/><line x1="42" y1="42" x2="56" y2="42"/></g>'
    };

    const CIRCUMFERENCE = 2 * Math.PI * 56;

    function playChime() {
      try { chimeSound.currentTime = 0; chimeSound.volume = 0.1; chimeSound.play().catch(() => {}); } catch {}
    }

    function clearTimers() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      if (breathingInterval) { clearInterval(breathingInterval); breathingInterval = null; }
    }

    function showBreak(breakData) {
      currentBreakData = breakData;
      currentActivityIndex = 0;
      timerStarted = false;
      clearTimers();
      playChime();

      btnSnooze.disabled = false;
      btnSnooze.style.opacity = 1;
      snoozeInfo.textContent = '';

      activityQueue.innerHTML = breakData.activities
        .map((_, i) => `<div class="queue-dot ${i === 0 ? 'active' : ''}"></div>`)
        .join('');

      overlay.classList.add('visible');
      showCurrentActivity();
    }

    function showCurrentActivity() {
      clearTimers();
      timerStarted = false;

      const activity = currentBreakData.activities[currentActivityIndex];

      // Update dots
      document.querySelectorAll('.queue-dot').forEach((dot, i) => {
        dot.className = 'queue-dot' +
          (i < currentActivityIndex ? ' completed' : '') +
          (i === currentActivityIndex ? ' active' : '');
      });

      activityType.textContent = typeLabels[activity.type] || '';
      activityName.textContent = activity.name;
      activityInstructions.textContent = activity.instructions;

      // Hide all visuals
      stretchVisual.classList.remove('visible');
      breathingOrbContainer.classList.remove('visible');
      breathingOrb.className = 'breathing-orb';
      breathingOrbRing.className = 'breathing-orb-ring';
      postureVisual.classList.remove('visible');
      breathInstruction.style.display = 'none';
      $('sitFigure').style.display = 'none';
      $('standFigure').style.display = 'none';

      // Show relevant visual
      if (activity.animation && stretchFigures[activity.animation]) {
        stretchVisual.classList.add('visible');
        stretchSvg.innerHTML = stretchFigures[activity.animation];
      } else if (activity.type === 'breathing') {
        breathingOrbContainer.classList.add('visible');
        breathInstruction.style.display = 'block';
        breathInstruction.textContent = '';
        breathingLabel.textContent = 'breathe';
      } else if (activity.type === 'posture') {
        postureVisual.classList.add('visible');
        $(activity.newPosture === 'stand' ? 'standFigure' : 'sitFigure').style.display = 'block';
      }

      // Timer waiting
      timerContainer.classList.add('visible', 'waiting');
      remainingTime = activity.duration;
      timerText.textContent = remainingTime;
      timerProgress.style.strokeDasharray = CIRCUMFERENCE;
      timerProgress.style.strokeDashoffset = 0;

      startPrompt.classList.add('visible');
      actionButtons.style.display = 'none';

      requestAnimationFrame(() => btnStart.focus());
    }

    function startTimer() {
      if (timerStarted) return;
      timerStarted = true;

      const activity = currentBreakData.activities[currentActivityIndex];
      const duration = activity.duration;
      remainingTime = duration;

      startPrompt.classList.remove('visible');
      actionButtons.style.display = 'flex';
      timerContainer.classList.remove('waiting');

      if (activity.type === 'breathing') startBreathingCycle();

      function tick() {
        timerText.textContent = remainingTime;
        const progress = (duration - remainingTime) / duration;
        timerProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);

        if (remainingTime <= 0) {
          clearTimers();
          nextActivity();
        } else {
          remainingTime--;
        }
      }

      tick();
      timerInterval = setInterval(tick, 1000);
    }

    function startBreathingCycle() {
      let phase = 0;
      const labels = ['in', 'hold', 'out'];
      const messages = ['breathe in...', 'hold...', 'release...'];
      const orbClasses = ['inhale', 'hold', ''];

      function nextPhase() {
        breathingOrb.className = 'breathing-orb' + (orbClasses[phase] ? ' ' + orbClasses[phase] : '');
        breathingOrbRing.className = 'breathing-orb-ring' + (orbClasses[phase] ? ' ' + orbClasses[phase] : '');
        breathingLabel.textContent = labels[phase];
        breathInstruction.textContent = messages[phase];
        phase = (phase + 1) % 3;
      }

      nextPhase();
      breathingInterval = setInterval(nextPhase, 4000);
    }

    function nextActivity() {
      clearTimers();
      currentActivityIndex++;
      if (currentActivityIndex >= currentBreakData.activities.length) {
        completeBreak();
      } else {
        showCurrentActivity();
      }
    }

    function completeBreak() {
      clearTimers();
      overlay.classList.remove('visible');
      ipcRenderer.send('break-complete');
    }

    function skipBreak() {
      clearTimers();
      overlay.classList.remove('visible');
      ipcRenderer.send('break-skip');
    }

    btnStart.addEventListener('click', startTimer);
    btnDone.addEventListener('click', nextActivity);
    btnSnooze.addEventListener('click', () => ipcRenderer.send('break-snooze'));
    btnSkip.addEventListener('click', skipBreak);

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Escape') { e.preventDefault(); skipBreak(); return; }
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
        e.preventDefault();
        timerStarted ? nextActivity() : startTimer();
      }
    });

    ipcRenderer.on('show-break', (_, breakData) => showBreak(breakData));

    ipcRenderer.on('snooze-result', (_, result) => {
      if (result.snoozed) { clearTimers(); overlay.classList.remove('visible'); }
      else { snoozeInfo.textContent = 'No snoozes remaining'; btnSnooze.disabled = true; btnSnooze.style.opacity = 0.5; }
    });
  </script>
</body>
</html>

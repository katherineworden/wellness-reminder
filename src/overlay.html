<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellness Break</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #171511;
      --ink-deep: #121009;
      --ivory: #e8e2d3;
      --stone: #8d8674;
      --stone-faint: #55503f;
      --serif: 'Iowan Old Style', 'Palatino', 'Times New Roman', Georgia, serif;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--serif);
      overflow: hidden;
      background: var(--ink);
      -webkit-font-smoothing: antialiased;
      cursor: default;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 120% 90% at 50% 40%, #1c1913 0%, var(--ink) 55%, var(--ink-deep) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 1.8s ease;
    }

    .overlay.visible { opacity: 1; }

    .content {
      text-align: center;
      position: relative;
      max-width: 560px;
      padding: 40px;
      color: var(--ivory);
    }

    /* Step marks — short hairlines, like section marks in a book */
    .activity-queue {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-bottom: 56px;
      height: 2px;
    }

    .queue-dot {
      width: 14px;
      height: 1px;
      background: rgba(232, 226, 211, 0.14);
      transition: all 0.9s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .queue-dot.active {
      width: 26px;
      background: rgba(232, 226, 211, 0.75);
    }

    .queue-dot.completed { background: rgba(232, 226, 211, 0.38); }

    /* Kind of pause — spaced capitals over a hairline */
    .activity-type {
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--stone);
      margin-bottom: 22px;
      font-weight: 400;
    }

    .activity-type::after {
      content: '';
      display: block;
      width: 36px;
      height: 1px;
      background: rgba(141, 134, 116, 0.35);
      margin: 20px auto 0;
    }

    .activity-name {
      font-size: 54px;
      font-weight: 400;
      font-style: italic;
      margin-bottom: 30px;
      letter-spacing: 0.5px;
      color: var(--ivory);
      line-height: 1.15;
    }

    .activity-instructions {
      font-size: 17px;
      font-weight: 400;
      line-height: 1.95;
      margin-bottom: 46px;
      color: rgba(232, 226, 211, 0.58);
      max-width: 42ch;
      margin-left: auto;
      margin-right: auto;
    }

    /* Entrance — quiet fade-up, staggered */
    .fade-in { animation: fadeUp 1.1s cubic-bezier(0.25, 0.1, 0.25, 1) both; }
    .fade-in.d1 { animation-delay: 0.1s; }
    .fade-in.d2 { animation-delay: 0.22s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Stretch figures — faint line drawings */
    .visual-container {
      width: 120px; height: 120px;
      margin: 0 auto 38px;
      display: none;
    }

    .visual-container.visible { display: block; }

    .stretch-figure { width: 100%; height: 100%; }
    .stretch-figure line, .stretch-figure path {
      stroke: rgba(232, 226, 211, 0.4);
      stroke-width: 1.25;
      stroke-linecap: round;
      fill: none;
    }
    .stretch-figure circle { fill: rgba(232, 226, 211, 0.4); }
    .stretch-figure circle[data-ring] { fill: none; stroke: rgba(232, 226, 211, 0.4); }

    /* Breathing — a single hairline ring, swelling and settling */
    .breath-container {
      width: 220px; height: 220px;
      margin: 0 auto 48px;
      display: none;
      position: relative;
    }

    .breath-container.visible { display: block; }

    .breath-ring {
      position: absolute;
      top: 50%; left: 50%;
      width: 110px; height: 110px;
      margin: -55px 0 0 -55px;
      border-radius: 50%;
      border: 1px solid rgba(232, 226, 211, 0.3);
      transition: transform 4s cubic-bezier(0.4, 0, 0.35, 1), border-color 4s ease;
      transform: scale(1);
    }

    .breath-ring.inhale, .breath-ring.hold {
      transform: scale(1.62);
      border-color: rgba(232, 226, 211, 0.5);
    }

    .breath-word {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-style: italic;
      font-size: 16px;
      color: rgba(232, 226, 211, 0.55);
      letter-spacing: 1px;
    }

    .breath-instruction {
      font-size: 17px;
      font-style: italic;
      color: rgba(232, 226, 211, 0.5);
      margin-bottom: 36px;
      letter-spacing: 0.5px;
    }

    /* Posture figures */
    .posture-visual {
      width: 100px; height: 100px;
      margin: 0 auto 48px;
      display: none;
    }

    .posture-visual.visible { display: block; }

    /* Timer — a serif numeral inside a hairline ring */
    .timer-container {
      margin-bottom: 44px;
      display: none;
    }

    .timer-container.visible { display: block; }
    .timer-container.waiting { opacity: 0.22; }

    .timer-ring {
      width: 116px; height: 116px;
      margin: 0 auto;
      position: relative;
    }

    .timer-ring svg { transform: rotate(-90deg); }

    .timer-ring circle { fill: none; stroke-width: 1; }
    .timer-ring .bg { stroke: rgba(232, 226, 211, 0.1); }

    .timer-ring .progress {
      stroke: rgba(232, 226, 211, 0.45);
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }

    .timer-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      font-weight: 400;
      color: rgba(232, 226, 211, 0.8);
      font-variant-numeric: tabular-nums;
    }

    /* Actions — plain words, set like print. No pills, no boxes. */
    .btn {
      background: none;
      border: none;
      font-family: var(--serif);
      cursor: pointer;
      transition: color 0.4s ease, border-color 0.4s ease;
      outline: none;
    }

    .btn-begin {
      font-size: 15px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(232, 226, 211, 0.82);
      padding: 6px 2px;
      border-bottom: 1px solid rgba(232, 226, 211, 0.3);
    }

    .btn-begin:hover, .btn-begin:focus-visible {
      color: var(--ivory);
      border-bottom-color: rgba(232, 226, 211, 0.7);
    }

    .btn-quiet {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(141, 134, 116, 0.65);
      padding: 6px 4px;
    }

    .btn-quiet:hover, .btn-quiet:focus-visible { color: rgba(232, 226, 211, 0.7); }

    .btn-whisper {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(141, 134, 116, 0.35);
      padding: 10px 4px;
      margin-top: 14px;
    }

    .btn-whisper:hover, .btn-whisper:focus-visible { color: rgba(141, 134, 116, 0.7); }

    .buttons {
      display: none;
      gap: 40px;
      justify-content: center;
      align-items: baseline;
    }

    .start-prompt { display: none; }
    .start-prompt.visible { display: block; }

    .snooze-info {
      margin-top: 14px;
      font-size: 12px;
      font-style: italic;
      color: rgba(141, 134, 116, 0.5);
    }

    .keyboard-hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      font-style: italic;
      color: rgba(141, 134, 116, 0.32);
      letter-spacing: 0.5px;
    }

    /* Figure motion — barely there */
    .figure-animated { animation: gentleBob 5s ease-in-out infinite; }
    @keyframes gentleBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

    .neck-roll-anim .head { animation: neckRoll 6s ease-in-out infinite; transform-origin: center bottom; }
    @keyframes neckRoll { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 75% { transform: rotate(-10deg); } }

    .shoulder-shrug-anim .shoulders { animation: shrug 3s ease-in-out infinite; }
    @keyframes shrug { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    .wrist-circle-anim .hand { animation: wrist 3s linear infinite; transform-origin: center; }
    @keyframes wrist { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="content">
      <div class="activity-queue" id="activityQueue"></div>
      <div class="activity-type" id="activityType"></div>
      <h1 class="activity-name" id="activityName"></h1>
      <p class="activity-instructions" id="activityInstructions"></p>

      <p class="breath-instruction" id="breathInstruction" style="display: none;"></p>

      <div class="visual-container" id="stretchVisual">
        <svg class="stretch-figure" viewBox="0 0 100 100" id="stretchSvg"></svg>
      </div>

      <div class="breath-container" id="breathContainer">
        <div class="breath-ring" id="breathRing"></div>
        <div class="breath-word" id="breathWord">breathe</div>
      </div>

      <svg class="posture-visual" id="postureVisual" viewBox="0 0 100 120">
        <g id="sitFigure" style="display:none;">
          <circle cx="50" cy="25" r="10" fill="rgba(232,226,211,0.3)"/>
          <path d="M50 35 L50 60" stroke="rgba(232,226,211,0.3)" stroke-width="1.25"/>
          <path d="M50 60 L35 75 L35 95" stroke="rgba(232,226,211,0.3)" stroke-width="1.25"/>
          <path d="M50 60 L65 75 L65 95" stroke="rgba(232,226,211,0.3)" stroke-width="1.25"/>
          <path d="M50 45 L30 55" stroke="rgba(232,226,211,0.3)" stroke-width="1.25"/>
          <path d="M50 45 L70 55" stroke="rgba(232,226,211,0.3)" stroke-width="1.25"/>
          <rect x="25" y="70" width="50" height="2" rx="1" fill="rgba(232,226,211,0.12)"/>
        </g>
        <g id="standFigure" style="display:none;">
          <circle cx="50" cy="20" r="10" fill="rgba(232,226,211,0.3)"/>
          <path d="M50 30 L50 65" stroke="rgba(232,226,211,0.3)" stroke-width="1.25"/>
          <path d="M50 65 L40 100" stroke="rgba(232,226,211,0.3)" stroke-width="1.25"/>
          <path d="M50 65 L60 100" stroke="rgba(232,226,211,0.3)" stroke-width="1.25"/>
          <path d="M50 40 L30 55" stroke="rgba(232,226,211,0.3)" stroke-width="1.25"/>
          <path d="M50 40 L70 55" stroke="rgba(232,226,211,0.3)" stroke-width="1.25"/>
        </g>
      </svg>

      <div class="timer-container" id="timerContainer">
        <div class="timer-ring">
          <svg width="116" height="116" viewBox="0 0 116 116">
            <circle class="bg" cx="58" cy="58" r="54"/>
            <circle class="progress" id="timerProgress" cx="58" cy="58" r="54"
                    stroke-dasharray="339.29" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-text" id="timerText">20</div>
        </div>
      </div>

      <div class="start-prompt visible" id="startPrompt">
        <button class="btn btn-begin" id="btnStart" autofocus>Begin</button>
      </div>

      <div class="buttons" id="actionButtons">
        <button class="btn btn-quiet" id="btnDone">Done</button>
        <button class="btn btn-quiet" id="btnSnooze">Snooze</button>
      </div>
      <div><button class="btn btn-whisper" id="btnSkip">Skip</button></div>
      <div class="snooze-info" id="snoozeInfo"></div>
    </div>

    <div class="keyboard-hint">enter to begin &nbsp;&middot;&nbsp; esc to skip</div>
  </div>

  <audio id="chimeSound" preload="auto">
    <source src="../sounds/chime.wav" type="audio/wav">
  </audio>

  <script>
    const { ipcRenderer } = require('electron');

    let currentBreakData = null;
    let currentActivityIndex = 0;
    let timerInterval = null;
    let breathingInterval = null;
    let remainingTime = 0;
    let timerStarted = false;

    const $ = id => document.getElementById(id);
    const overlay = $('overlay');
    const activityType = $('activityType');
    const activityName = $('activityName');
    const activityInstructions = $('activityInstructions');
    const timerProgress = $('timerProgress');
    const timerText = $('timerText');
    const timerContainer = $('timerContainer');
    const activityQueue = $('activityQueue');
    const stretchVisual = $('stretchVisual');
    const stretchSvg = $('stretchSvg');
    const breathContainer = $('breathContainer');
    const breathRing = $('breathRing');
    const breathWord = $('breathWord');
    const breathInstruction = $('breathInstruction');
    const postureVisual = $('postureVisual');
    const startPrompt = $('startPrompt');
    const actionButtons = $('actionButtons');
    const btnStart = $('btnStart');
    const btnDone = $('btnDone');
    const btnSnooze = $('btnSnooze');
    const btnSkip = $('btnSkip');
    const snoozeInfo = $('snoozeInfo');
    const chimeSound = $('chimeSound');

    const typeLabels = {
      'eye': 'Eyes',
      'combo': 'Eyes & Stretch',
      'micro-stretch': 'Stretch',
      'full-stretch': 'Stretch',
      'posture': 'Posture',
      'walk': 'Movement',
      'breathing': 'Breath'
    };

    const stretchFigures = {
      'neck-roll': '<g class="neck-roll-anim figure-animated"><circle class="head" cx="50" cy="25" r="10"/><line x1="50" y1="35" x2="50" y2="65"/><line x1="35" y1="50" x2="65" y2="50"/><line x1="50" y1="65" x2="38" y2="90"/><line x1="50" y1="65" x2="62" y2="90"/></g>',
      'shoulder-shrug': '<g class="shoulder-shrug-anim"><circle cx="50" cy="22" r="9"/><line x1="50" y1="31" x2="50" y2="60"/><g class="shoulders"><line x1="35" y1="42" x2="65" y2="42"/><line x1="35" y1="42" x2="28" y2="58"/><line x1="65" y1="42" x2="72" y2="58"/></g><line x1="50" y1="60" x2="38" y2="88"/><line x1="50" y1="60" x2="62" y2="88"/></g>',
      'wrist-circle': '<g class="wrist-circle-anim"><line x1="20" y1="50" x2="50" y2="50"/><g class="hand"><circle data-ring cx="65" cy="50" r="12" stroke-width="1.25"/></g></g>',
      'ankle-circle': '<g class="figure-animated"><line x1="50" y1="20" x2="50" y2="55"/><ellipse cx="50" cy="72" rx="12" ry="6" stroke="rgba(232,226,211,0.32)" stroke-width="1.25" fill="none" style="animation:wrist 3s linear infinite;transform-origin:50px 55px;"/></g>',
      'ankle-stretch': '<g class="figure-animated"><line x1="50" y1="15" x2="50" y2="50"/><line x1="50" y1="50" x2="50" y2="70"/><path d="M50 70 L42 85 L58 85 Z"/></g>',
      'spinal-twist': '<g class="figure-animated"><circle cx="50" cy="22" r="9"/><path d="M50 31 Q58 45 50 60"/><line x1="38" y1="42" x2="62" y2="48"/><line x1="50" y1="60" x2="40" y2="85"/><line x1="50" y1="60" x2="60" y2="85"/></g>',
      'back-extension': '<g class="figure-animated"><circle cx="50" cy="28" r="9"/><path d="M50 37 Q42 52 50 68"/><line x1="50" y1="45" x2="32" y2="38"/><line x1="50" y1="45" x2="68" y2="38"/><line x1="50" y1="68" x2="40" y2="92"/><line x1="50" y1="68" x2="60" y2="92"/></g>',
      'hamstring': '<g class="figure-animated"><circle cx="35" cy="38" r="8"/><line x1="35" y1="46" x2="48" y2="65"/><line x1="48" y1="65" x2="78" y2="65"/><line x1="35" y1="50" x2="22" y2="62"/></g>',
      'hip-flexor': '<g class="figure-animated"><circle cx="50" cy="20" r="8"/><line x1="50" y1="28" x2="50" y2="52"/><line x1="50" y1="52" x2="38" y2="78"/><line x1="50" y1="52" x2="65" y2="88"/><line x1="50" y1="38" x2="35" y2="48"/><line x1="50" y1="38" x2="65" y2="48"/></g>',
      'chest-stretch': '<g class="figure-animated"><circle cx="50" cy="22" r="8"/><line x1="50" y1="30" x2="50" y2="58"/><line x1="50" y1="40" x2="28" y2="30"/><line x1="50" y1="40" x2="72" y2="30"/><line x1="50" y1="58" x2="40" y2="85"/><line x1="50" y1="58" x2="60" y2="85"/></g>',
      'figure-4': '<g class="figure-animated"><circle cx="50" cy="18" r="8"/><line x1="50" y1="26" x2="50" y2="50"/><line x1="50" y1="50" x2="38" y2="75"/><line x1="50" y1="50" x2="62" y2="62"/><line x1="62" y1="62" x2="45" y2="62"/></g>',
      'calf-stretch': '<g class="figure-animated"><circle cx="42" cy="28" r="8"/><line x1="42" y1="36" x2="50" y2="55"/><line x1="50" y1="55" x2="38" y2="88"/><line x1="50" y1="55" x2="68" y2="82"/><line x1="42" y1="42" x2="28" y2="48"/><line x1="42" y1="42" x2="56" y2="42"/></g>'
    };

    const CIRCUMFERENCE = 2 * Math.PI * 54;

    function playChime() {
      try { chimeSound.currentTime = 0; chimeSound.volume = 0.1; chimeSound.play().catch(() => {}); } catch {}
    }

    function clearTimers() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      if (breathingInterval) { clearInterval(breathingInterval); breathingInterval = null; }
    }

    function showBreak(breakData) {
      currentBreakData = breakData;
      currentActivityIndex = 0;
      timerStarted = false;
      clearTimers();
      playChime();

      btnSnooze.disabled = false;
      btnSnooze.style.opacity = 1;
      snoozeInfo.textContent = '';

      activityQueue.innerHTML = breakData.activities
        .map((_, i) => `<div class="queue-dot ${i === 0 ? 'active' : ''}"></div>`)
        .join('');

      overlay.classList.add('visible');
      showCurrentActivity();
    }

    function showCurrentActivity() {
      clearTimers();
      timerStarted = false;

      const activity = currentBreakData.activities[currentActivityIndex];

      document.querySelectorAll('.queue-dot').forEach((dot, i) => {
        dot.className = 'queue-dot' +
          (i < currentActivityIndex ? ' completed' : '') +
          (i === currentActivityIndex ? ' active' : '');
      });

      activityType.textContent = typeLabels[activity.type] || '';
      activityName.textContent = activity.name;
      activityInstructions.textContent = activity.instructions;

      // Quiet staggered entrance
      [[activityType, ''], [activityName, 'd1'], [activityInstructions, 'd2']].forEach(([el, d]) => {
        el.classList.remove('fade-in', 'd1', 'd2');
        void el.offsetWidth;
        el.classList.add('fade-in');
        if (d) el.classList.add(d);
      });

      // Hide all visuals
      stretchVisual.classList.remove('visible');
      breathContainer.classList.remove('visible');
      breathRing.className = 'breath-ring';
      postureVisual.classList.remove('visible');
      breathInstruction.style.display = 'none';
      $('sitFigure').style.display = 'none';
      $('standFigure').style.display = 'none';

      if (activity.animation && stretchFigures[activity.animation]) {
        stretchVisual.classList.add('visible');
        stretchSvg.innerHTML = stretchFigures[activity.animation];
      } else if (activity.type === 'breathing') {
        breathContainer.classList.add('visible');
        breathInstruction.style.display = 'block';
        breathInstruction.textContent = '';
        breathWord.textContent = 'breathe';
      } else if (activity.type === 'posture') {
        postureVisual.classList.add('visible');
        $(activity.newPosture === 'stand' ? 'standFigure' : 'sitFigure').style.display = 'block';
      }

      timerContainer.classList.add('visible', 'waiting');
      remainingTime = activity.duration;
      timerText.textContent = remainingTime;
      timerProgress.style.strokeDasharray = CIRCUMFERENCE;
      timerProgress.style.strokeDashoffset = 0;

      startPrompt.classList.add('visible');
      actionButtons.style.display = 'none';

      requestAnimationFrame(() => btnStart.focus());
    }

    function startTimer() {
      if (timerStarted) return;
      timerStarted = true;

      const activity = currentBreakData.activities[currentActivityIndex];
      const duration = activity.duration;
      remainingTime = duration;

      startPrompt.classList.remove('visible');
      actionButtons.style.display = 'flex';
      timerContainer.classList.remove('waiting');

      if (activity.type === 'breathing') startBreathingCycle();

      function tick() {
        timerText.textContent = remainingTime;
        const progress = (duration - remainingTime) / duration;
        timerProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);

        if (remainingTime <= 0) {
          clearTimers();
          nextActivity();
        } else {
          remainingTime--;
        }
      }

      tick();
      timerInterval = setInterval(tick, 1000);
    }

    function startBreathingCycle() {
      let phase = 0;
      const words = ['in', 'hold', 'out'];
      const lines = ['breathe in slowly', 'hold', 'let it go'];
      const ringClasses = ['inhale', 'hold', ''];

      function nextPhase() {
        breathRing.className = 'breath-ring' + (ringClasses[phase] ? ' ' + ringClasses[phase] : '');
        breathWord.textContent = words[phase];
        breathInstruction.textContent = lines[phase];
        phase = (phase + 1) % 3;
      }

      nextPhase();
      breathingInterval = setInterval(nextPhase, 4000);
    }

    function nextActivity() {
      clearTimers();
      currentActivityIndex++;
      if (currentActivityIndex >= currentBreakData.activities.length) {
        completeBreak();
      } else {
        showCurrentActivity();
      }
    }

    function completeBreak() {
      clearTimers();
      overlay.classList.remove('visible');
      ipcRenderer.send('break-complete');
    }

    function skipBreak() {
      clearTimers();
      overlay.classList.remove('visible');
      ipcRenderer.send('break-skip');
    }

    btnStart.addEventListener('click', startTimer);
    btnDone.addEventListener('click', nextActivity);
    btnSnooze.addEventListener('click', () => ipcRenderer.send('break-snooze'));
    btnSkip.addEventListener('click', skipBreak);

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Escape') { e.preventDefault(); skipBreak(); return; }
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
        e.preventDefault();
        timerStarted ? nextActivity() : startTimer();
      }
    });

    ipcRenderer.on('show-break', (_, breakData) => showBreak(breakData));

    ipcRenderer.on('snooze-result', (_, result) => {
      if (result.snoozed) { clearTimers(); overlay.classList.remove('visible'); }
      else { snoozeInfo.textContent = 'no snoozes remaining'; btnSnooze.disabled = true; btnSnooze.style.opacity = 0.5; }
    });
  </script>
</body>
</html>

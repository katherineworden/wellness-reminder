<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellness Break</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --paper: #f3ead2;
      --paper-deep: #e9dcb8;
      --pine: #2f4239;
      --pine-soft: #5c6e60;
      --terra: #c0522e;
      --mustard: #d9a441;
      --slab: 'Superclarendon', 'Bookman Old Style', 'Georgia', serif;
      --type: 'American Typewriter', 'Courier New', monospace;
      --book: 'Georgia', 'Iowan Old Style', serif;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--book);
      overflow: hidden;
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
      cursor: default;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    .overlay.visible { opacity: 1; }

    /* The poster frame — a double rule around the whole screen */
    .frame {
      position: fixed;
      inset: 16px;
      border: 2px solid var(--pine);
      pointer-events: none;
      z-index: 5;
    }

    .frame::after {
      content: '';
      position: absolute;
      inset: 5px;
      border: 1px solid var(--pine);
      opacity: 0.45;
    }

    .content {
      text-align: center;
      max-width: 600px;
      padding: 40px;
      color: var(--pine);
      position: relative;
      z-index: 10;
    }

    /* Step markers — little diamonds */
    .activity-queue {
      display: flex;
      gap: 14px;
      justify-content: center;
      align-items: center;
      margin-bottom: 44px;
      height: 10px;
    }

    .queue-dot {
      width: 7px; height: 7px;
      transform: rotate(45deg);
      background: transparent;
      border: 1.5px solid var(--pine-soft);
      transition: all 0.4s ease;
    }

    .queue-dot.active {
      background: var(--terra);
      border-color: var(--terra);
      transform: rotate(45deg) scale(1.25);
    }

    .queue-dot.completed {
      background: var(--pine-soft);
      border-color: var(--pine-soft);
    }

    /* Label — typewriter caps with a diamond ornament */
    .activity-type {
      font-family: var(--type);
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--terra);
      margin-bottom: 10px;
    }

    .ornament {
      color: var(--terra);
      font-size: 9px;
      letter-spacing: 6px;
      margin-bottom: 22px;
      user-select: none;
    }

    .activity-name {
      font-family: var(--slab);
      font-size: 50px;
      font-weight: 700;
      margin-bottom: 22px;
      color: var(--pine);
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .activity-instructions {
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 42px;
      color: var(--pine);
      opacity: 0.78;
      max-width: 46ch;
      margin-left: auto;
      margin-right: auto;
    }

    .fade-in { animation: fadeUp 0.7s ease both; }
    .fade-in.d1 { animation-delay: 0.07s; }
    .fade-in.d2 { animation-delay: 0.15s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in.d2 { animation-name: fadeUpSoft; }
    @keyframes fadeUpSoft {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 0.78; transform: translateY(0); }
    }

    /* Stretch figures */
    .visual-container {
      width: 110px; height: 110px;
      margin: 0 auto 32px;
      display: none;
    }

    .visual-container.visible { display: block; }

    .stretch-figure { width: 100%; height: 100%; }
    .stretch-figure line, .stretch-figure path {
      stroke: var(--pine);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
      opacity: 0.75;
    }
    .stretch-figure circle { fill: var(--pine); opacity: 0.75; }
    .stretch-figure circle[data-ring] { fill: none; stroke: var(--pine); stroke-width: 2; }

    /* Breathing — a double-ringed circle that swells */
    .breath-container {
      width: 210px; height: 210px;
      margin: 0 auto 32px;
      display: none;
      position: relative;
    }

    .breath-container.visible { display: block; }

    .breath-ring {
      position: absolute;
      top: 50%; left: 50%;
      width: 108px; height: 108px;
      margin: -54px 0 0 -54px;
      border-radius: 50%;
      border: 2px solid var(--pine);
      transition: transform 4s cubic-bezier(0.4, 0, 0.35, 1);
      transform: scale(1);
    }

    .breath-ring::after {
      content: '';
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 1px solid var(--pine);
      opacity: 0.4;
    }

    .breath-ring.inhale, .breath-ring.hold { transform: scale(1.55); }

    .breath-word {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--type);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--terra);
    }

    .breath-instruction {
      font-style: italic;
      font-size: 16px;
      color: var(--pine-soft);
      margin-bottom: 28px;
    }

    /* Posture figures */
    .posture-visual {
      width: 96px; height: 96px;
      margin: 0 auto 32px;
      display: none;
    }

    .posture-visual.visible { display: block; }

    /* Timer — slab numeral in a ring */
    .timer-container {
      margin-bottom: 40px;
      display: none;
    }

    .timer-container.visible { display: block; }
    .timer-container.waiting { opacity: 0.3; }

    .timer-ring {
      width: 108px; height: 108px;
      margin: 0 auto;
      position: relative;
    }

    .timer-ring svg { transform: rotate(-90deg); }

    .timer-ring circle { fill: none; stroke-width: 3; }
    .timer-ring .bg { stroke: var(--paper-deep); }

    .timer-ring .progress {
      stroke: var(--terra);
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }

    .timer-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--slab);
      font-size: 30px;
      font-weight: 700;
      color: var(--pine);
      font-variant-numeric: tabular-nums;
    }

    /* Buttons — letterpress tickets */
    .btn {
      font-family: var(--type);
      cursor: pointer;
      outline: none;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .btn-primary {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--pine);
      background: transparent;
      border: 2px solid var(--pine);
      padding: 13px 40px;
      border-radius: 3px;
    }

    .btn-primary:hover, .btn-primary:focus-visible {
      background: var(--pine);
      color: var(--paper);
    }

    .btn-secondary {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--pine-soft);
      background: transparent;
      border: 1px solid transparent;
      padding: 13px 20px;
    }

    .btn-secondary:hover, .btn-secondary:focus-visible { color: var(--pine); }

    .btn-text {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--pine-soft);
      background: none;
      border: none;
      opacity: 0.6;
      padding: 10px 16px;
      margin-top: 12px;
    }

    .btn-text:hover { opacity: 1; }

    .buttons {
      display: none;
      gap: 14px;
      justify-content: center;
      align-items: center;
    }

    .start-prompt { display: none; }
    .start-prompt.visible { display: block; }

    .snooze-info {
      margin-top: 12px;
      font-style: italic;
      font-size: 13px;
      color: var(--pine-soft);
    }

    .keyboard-hint {
      position: fixed;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--type);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--pine-soft);
      opacity: 0.65;
      z-index: 10;
    }

    /* Figure motion */
    .figure-animated { animation: gentleBob 4s ease-in-out infinite; }
    @keyframes gentleBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

    .neck-roll-anim .head { animation: neckRoll 5s ease-in-out infinite; transform-origin: center bottom; }
    @keyframes neckRoll { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(11deg); } 75% { transform: rotate(-11deg); } }

    .shoulder-shrug-anim .shoulders { animation: shrug 2.5s ease-in-out infinite; }
    @keyframes shrug { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    .wrist-circle-anim .hand { animation: wrist 2.5s linear infinite; transform-origin: center; }
    @keyframes wrist { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="frame"></div>

    <div class="content">
      <div class="activity-queue" id="activityQueue"></div>
      <div class="activity-type" id="activityType"></div>
      <div class="ornament">&#10038;&nbsp;&#9789;&nbsp;&#10038;</div>
      <h1 class="activity-name" id="activityName"></h1>
      <p class="activity-instructions" id="activityInstructions"></p>

      <p class="breath-instruction" id="breathInstruction" style="display: none;"></p>

      <div class="visual-container" id="stretchVisual">
        <svg class="stretch-figure" viewBox="0 0 100 100" id="stretchSvg"></svg>
      </div>

      <div class="breath-container" id="breathContainer">
        <div class="breath-ring" id="breathRing"></div>
        <div class="breath-word" id="breathWord">in</div>
      </div>

      <svg class="posture-visual" id="postureVisual" viewBox="0 0 100 120">
        <g id="sitFigure" style="display:none;">
          <circle cx="50" cy="25" r="10" fill="#2f4239" opacity="0.75"/>
          <path d="M50 35 L50 60" stroke="#2f4239" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
          <path d="M50 60 L35 75 L35 95" stroke="#2f4239" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>
          <path d="M50 60 L65 75 L65 95" stroke="#2f4239" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>
          <path d="M50 45 L30 55" stroke="#2f4239" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
          <path d="M50 45 L70 55" stroke="#2f4239" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
          <rect x="25" y="70" width="50" height="3" rx="1.5" fill="#2f4239" opacity="0.3"/>
        </g>
        <g id="standFigure" style="display:none;">
          <circle cx="50" cy="20" r="10" fill="#2f4239" opacity="0.75"/>
          <path d="M50 30 L50 65" stroke="#2f4239" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
          <path d="M50 65 L40 100" stroke="#2f4239" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
          <path d="M50 65 L60 100" stroke="#2f4239" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
          <path d="M50 40 L30 55" stroke="#2f4239" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
          <path d="M50 40 L70 55" stroke="#2f4239" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
        </g>
      </svg>

      <div class="timer-container" id="timerContainer">
        <div class="timer-ring">
          <svg width="108" height="108" viewBox="0 0 108 108">
            <circle class="bg" cx="54" cy="54" r="49"/>
            <circle class="progress" id="timerProgress" cx="54" cy="54" r="49"
                    stroke-dasharray="307.88" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-text" id="timerText">20</div>
        </div>
      </div>

      <div class="start-prompt visible" id="startPrompt">
        <button class="btn btn-primary" id="btnStart" autofocus>Begin</button>
      </div>

      <div class="buttons" id="actionButtons">
        <button class="btn btn-primary" id="btnDone">Done</button>
        <button class="btn btn-secondary" id="btnSnooze">Snooze</button>
      </div>
      <div><button class="btn btn-text" id="btnSkip">Skip</button></div>
      <div class="snooze-info" id="snoozeInfo"></div>
    </div>

    <div class="keyboard-hint">return &middot; begin &nbsp;&nbsp;&nbsp; esc &middot; skip</div>
  </div>

  <audio id="chimeSound" preload="auto">
    <source src="../sounds/chime.wav" type="audio/wav">
  </audio>

  <script>
    const { ipcRenderer } = require('electron');

    let currentBreakData = null;
    let currentActivityIndex = 0;
    let timerInterval = null;
    let breathingInterval = null;
    let remainingTime = 0;
    let timerStarted = false;

    const $ = id => document.getElementById(id);
    const overlay = $('overlay');
    const activityType = $('activityType');
    const activityName = $('activityName');
    const activityInstructions = $('activityInstructions');
    const timerProgress = $('timerProgress');
    const timerText = $('timerText');
    const timerContainer = $('timerContainer');
    const activityQueue = $('activityQueue');
    const stretchVisual = $('stretchVisual');
    const stretchSvg = $('stretchSvg');
    const breathContainer = $('breathContainer');
    const breathRing = $('breathRing');
    const breathWord = $('breathWord');
    const breathInstruction = $('breathInstruction');
    const postureVisual = $('postureVisual');
    const startPrompt = $('startPrompt');
    const actionButtons = $('actionButtons');
    const btnStart = $('btnStart');
    const btnDone = $('btnDone');
    const btnSnooze = $('btnSnooze');
    const btnSkip = $('btnSkip');
    const snoozeInfo = $('snoozeInfo');
    const chimeSound = $('chimeSound');

    const typeLabels = {
      'eye': 'Eyes',
      'combo': 'Eyes & Stretch',
      'micro-stretch': 'Quick Stretch',
      'full-stretch': 'Full Stretch',
      'posture': 'Posture',
      'walk': 'A Walk',
      'breathing': 'Breathing'
    };

    const stretchFigures = {
      'neck-roll': '<g class="neck-roll-anim figure-animated"><circle class="head" cx="50" cy="25" r="10"/><line x1="50" y1="35" x2="50" y2="65"/><line x1="35" y1="50" x2="65" y2="50"/><line x1="50" y1="65" x2="38" y2="90"/><line x1="50" y1="65" x2="62" y2="90"/></g>',
      'shoulder-shrug': '<g class="shoulder-shrug-anim"><circle cx="50" cy="22" r="9"/><line x1="50" y1="31" x2="50" y2="60"/><g class="shoulders"><line x1="35" y1="42" x2="65" y2="42"/><line x1="35" y1="42" x2="28" y2="58"/><line x1="65" y1="42" x2="72" y2="58"/></g><line x1="50" y1="60" x2="38" y2="88"/><line x1="50" y1="60" x2="62" y2="88"/></g>',
      'wrist-circle': '<g class="wrist-circle-anim"><line x1="20" y1="50" x2="50" y2="50"/><g class="hand"><circle data-ring cx="65" cy="50" r="12"/></g></g>',
      'ankle-circle': '<g class="figure-animated"><line x1="50" y1="20" x2="50" y2="55"/><ellipse cx="50" cy="72" rx="12" ry="6" stroke="#2f4239" stroke-width="2" fill="none" opacity="0.75" style="animation:wrist 2.5s linear infinite;transform-origin:50px 55px;"/></g>',
      'ankle-stretch': '<g class="figure-animated"><line x1="50" y1="15" x2="50" y2="50"/><line x1="50" y1="50" x2="50" y2="70"/><path d="M50 70 L42 85 L58 85 Z"/></g>',
      'spinal-twist': '<g class="figure-animated"><circle cx="50" cy="22" r="9"/><path d="M50 31 Q58 45 50 60"/><line x1="38" y1="42" x2="62" y2="48"/><line x1="50" y1="60" x2="40" y2="85"/><line x1="50" y1="60" x2="60" y2="85"/></g>',
      'back-extension': '<g class="figure-animated"><circle cx="50" cy="28" r="9"/><path d="M50 37 Q42 52 50 68"/><line x1="50" y1="45" x2="32" y2="38"/><line x1="50" y1="45" x2="68" y2="38"/><line x1="50" y1="68" x2="40" y2="92"/><line x1="50" y1="68" x2="60" y2="92"/></g>',
      'hamstring': '<g class="figure-animated"><circle cx="35" cy="38" r="8"/><line x1="35" y1="46" x2="48" y2="65"/><line x1="48" y1="65" x2="78" y2="65"/><line x1="35" y1="50" x2="22" y2="62"/></g>',
      'hip-flexor': '<g class="figure-animated"><circle cx="50" cy="20" r="8"/><line x1="50" y1="28" x2="50" y2="52"/><line x1="50" y1="52" x2="38" y2="78"/><line x1="50" y1="52" x2="65" y2="88"/><line x1="50" y1="38" x2="35" y2="48"/><line x1="50" y1="38" x2="65" y2="48"/></g>',
      'chest-stretch': '<g class="figure-animated"><circle cx="50" cy="22" r="8"/><line x1="50" y1="30" x2="50" y2="58"/><line x1="50" y1="40" x2="28" y2="30"/><line x1="50" y1="40" x2="72" y2="30"/><line x1="50" y1="58" x2="40" y2="85"/><line x1="50" y1="58" x2="60" y2="85"/></g>',
      'figure-4': '<g class="figure-animated"><circle cx="50" cy="18" r="8"/><line x1="50" y1="26" x2="50" y2="50"/><line x1="50" y1="50" x2="38" y2="75"/><line x1="50" y1="50" x2="62" y2="62"/><line x1="62" y1="62" x2="45" y2="62"/></g>',
      'calf-stretch': '<g class="figure-animated"><circle cx="42" cy="28" r="8"/><line x1="42" y1="36" x2="50" y2="55"/><line x1="50" y1="55" x2="38" y2="88"/><line x1="50" y1="55" x2="68" y2="82"/><line x1="42" y1="42" x2="28" y2="48"/><line x1="42" y1="42" x2="56" y2="42"/></g>'
    };

    const CIRCUMFERENCE = 2 * Math.PI * 49;

    function playChime() {
      try { chimeSound.currentTime = 0; chimeSound.volume = 0.12; chimeSound.play().catch(() => {}); } catch {}
    }

    function clearTimers() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      if (breathingInterval) { clearInterval(breathingInterval); breathingInterval = null; }
    }

    function showBreak(breakData) {
      currentBreakData = breakData;
      currentActivityIndex = 0;
      timerStarted = false;
      clearTimers();
      playChime();

      btnSnooze.disabled = false;
      btnSnooze.style.opacity = 1;
      snoozeInfo.textContent = '';

      activityQueue.innerHTML = breakData.activities
        .map((_, i) => `<div class="queue-dot ${i === 0 ? 'active' : ''}"></div>`)
        .join('');

      overlay.classList.add('visible');
      showCurrentActivity();
    }

    function showCurrentActivity() {
      clearTimers();
      timerStarted = false;

      const activity = currentBreakData.activities[currentActivityIndex];

      document.querySelectorAll('.queue-dot').forEach((dot, i) => {
        dot.className = 'queue-dot' +
          (i < currentActivityIndex ? ' completed' : '') +
          (i === currentActivityIndex ? ' active' : '');
      });

      // Posture switches get a clear directive label
      activityType.textContent = activity.newPosture
        ? (activity.newPosture === 'stand' ? 'Stand Up' : 'Sit Down')
        : (typeLabels[activity.type] || '');
      activityName.textContent = activity.name;
      activityInstructions.textContent = activity.instructions;

      [[activityType, ''], [activityName, 'd1'], [activityInstructions, 'd2']].forEach(([el, d]) => {
        el.classList.remove('fade-in', 'd1', 'd2');
        void el.offsetWidth;
        el.classList.add('fade-in');
        if (d) el.classList.add(d);
      });

      // Hide all visuals
      stretchVisual.classList.remove('visible');
      breathContainer.classList.remove('visible');
      breathRing.className = 'breath-ring';
      postureVisual.classList.remove('visible');
      breathInstruction.style.display = 'none';
      $('sitFigure').style.display = 'none';
      $('standFigure').style.display = 'none';

      if (activity.animation && stretchFigures[activity.animation]) {
        stretchVisual.classList.add('visible');
        stretchSvg.innerHTML = stretchFigures[activity.animation];
      } else if (activity.type === 'breathing') {
        if (activity.newPosture) {
          // Show the stand/sit figure first — the ring takes over once begun
          postureVisual.classList.add('visible');
          $(activity.newPosture === 'stand' ? 'standFigure' : 'sitFigure').style.display = 'block';
        } else {
          breathContainer.classList.add('visible');
        }
        breathInstruction.style.display = 'block';
        breathInstruction.textContent = '';
        breathWord.textContent = 'in';
      } else if (activity.type === 'posture') {
        postureVisual.classList.add('visible');
        $(activity.newPosture === 'stand' ? 'standFigure' : 'sitFigure').style.display = 'block';
      }

      timerContainer.classList.add('visible', 'waiting');
      remainingTime = activity.duration;
      timerText.textContent = remainingTime;
      timerProgress.style.strokeDasharray = CIRCUMFERENCE;
      timerProgress.style.strokeDashoffset = 0;

      startPrompt.classList.add('visible');
      actionButtons.style.display = 'none';

      requestAnimationFrame(() => btnStart.focus());
    }

    function startTimer() {
      if (timerStarted) return;
      timerStarted = true;

      const activity = currentBreakData.activities[currentActivityIndex];
      const duration = activity.duration;
      remainingTime = duration;

      startPrompt.classList.remove('visible');
      actionButtons.style.display = 'flex';
      timerContainer.classList.remove('waiting');

      if (activity.type === 'breathing') {
        // Swap the posture figure for the breathing ring once they begin
        postureVisual.classList.remove('visible');
        $('sitFigure').style.display = 'none';
        $('standFigure').style.display = 'none';
        breathContainer.classList.add('visible');
        startBreathingCycle();
      }

      function tick() {
        timerText.textContent = remainingTime;
        const progress = (duration - remainingTime) / duration;
        timerProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);

        if (remainingTime <= 0) {
          clearTimers();
          nextActivity();
        } else {
          remainingTime--;
        }
      }

      tick();
      timerInterval = setInterval(tick, 1000);
    }

    function startBreathingCycle() {
      let phase = 0;
      const words = ['in', 'hold', 'out'];
      const lines = ['Breathe in, slowly', 'Hold it there', 'And let it go'];
      const ringClasses = ['inhale', 'hold', ''];

      function nextPhase() {
        breathRing.className = 'breath-ring' + (ringClasses[phase] ? ' ' + ringClasses[phase] : '');
        breathWord.textContent = words[phase];
        breathInstruction.textContent = lines[phase];
        phase = (phase + 1) % 3;
      }

      nextPhase();
      breathingInterval = setInterval(nextPhase, 4000);
    }

    function nextActivity() {
      clearTimers();
      currentActivityIndex++;
      if (currentActivityIndex >= currentBreakData.activities.length) {
        completeBreak();
      } else {
        showCurrentActivity();
      }
    }

    function completeBreak() {
      clearTimers();
      overlay.classList.remove('visible');
      ipcRenderer.send('break-complete');
    }

    function skipBreak() {
      clearTimers();
      overlay.classList.remove('visible');
      ipcRenderer.send('break-skip');
    }

    btnStart.addEventListener('click', startTimer);
    btnDone.addEventListener('click', nextActivity);
    btnSnooze.addEventListener('click', () => ipcRenderer.send('break-snooze'));
    btnSkip.addEventListener('click', skipBreak);

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Escape') { e.preventDefault(); skipBreak(); return; }
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
        e.preventDefault();
        timerStarted ? nextActivity() : startTimer();
      }
    });

    ipcRenderer.on('show-break', (_, breakData) => showBreak(breakData));

    ipcRenderer.on('snooze-result', (_, result) => {
      if (result.snoozed) { clearTimers(); overlay.classList.remove('visible'); }
      else { snoozeInfo.textContent = 'No snoozes remaining'; btnSnooze.disabled = true; btnSnooze.style.opacity = 0.5; }
    });
  </script>
</body>
</html>
